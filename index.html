<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Font Preview Tool</title>

  <style>
    /* === FONT DEFINITIONS === */
    /* Replace the URLs with your actual GitHub raw links */
@font-face {
      font-family: 'AlegreyaSC';
      src: url('https://raw.githubusercontent.com/beaconcarve-svg/Font-Preview/main/Fonts_BC/AlegreyaSC-Medium.ttf') format('truetype');
    }
@font-face {
      font-family: 'Atma';
      src: url('https://raw.githubusercontent.com/beaconcarve-svg/Font-Preview/main/Fonts_BC/Atma-Regular.ttf') format('truetype');
    }
@font-face {
      font-family: 'SFCompactRounded';
      src: url('https://raw.githubusercontent.com/beaconcarve-svg/Font-Preview/main/Fonts_BC/SFCompactRounded.ttf') format('truetype');
    }
/* === STYLING === */

body {
  font-family: sans-serif;
  text-align: center;
  background: #ffffff;
  color: #000000;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: 0 auto;
}

.instructions {
  margin-bottom: 25px;
}

.instructions h2 {
  margin-bottom: 8px;
  font-size: 28px;
  color: #30625C;
}

.instructions p {
  font-size: 16px;
  color: #444;
  line-height: 1.5;
}

input {
  width: 100%;
  box-sizing: border-box;
  font-size: 18px;
  padding: 12px;
  margin-bottom: 30px;
  border: 1px solid #314946;
  border-radius: 6px;
  background: #ffffff;
  color: #000000;
}

.font-block {
  padding: 20px 10px;
  border-bottom: 1px solid #dddddd;
}

.font-block:last-child {
  border-bottom: none;
}
</style>

<script>
const fonts = [
  { name: "Alegreya SC", class: "AlegreyaSC" },
  { name: "Atma", class: "Atma" },
  { name: "SF Compact Rounded", class: "SFCompactRounded" }
];

function updatePreviews() {
  const text =
    document.getElementById("userText").value || "Your preview text";

  const container = document.getElementById("allFontsPreview");
  container.innerHTML = "";

  fonts.forEach(f => {
    const block = document.createElement("div");
    block.classList.add("font-block");

   block.innerHTML = `
  <div class="font-name">
    ${f.name}
  </div>

  <div class="font-preview" style="font-family:'${f.class}';">
    ${text}
  </div>
`;

    container.appendChild(block);
  });
}

document
  .getElementById("userText")
  .addEventListener("input", updatePreviews);

updatePreviews();
</script>

</body>
